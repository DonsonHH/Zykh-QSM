<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智药康护</title>
  <link rel="stylesheet" href="/terminal.css">
</head>
<body>
  <main class="home-shell">
    <header class="home-top">
      <div class="brand">
        <div class="brand-shield">药</div>
        <div>
          <h1>智药康护</h1>
          <p>QSM368ZP-WF</p>
        </div>
      </div>
      <div class="welcome-pill">
        <span></span>
        <strong id="voiceText">欢迎使用智药康护，请选择需要的服务</strong>
      </div>
      <div class="net-clock">
        <b>网络正常</b>
        <strong id="topClock">--:--</strong>
        <span id="topDate">--</span>
      </div>
    </header>

    <section class="hero-grid">
      <article class="time-card">
        <strong id="clockText">--:--</strong>
        <span id="dateText">--</span>
      </article>

      <article class="next-card">
        <div class="next-label">
          <span></span>
          <strong>下次服药提醒</strong>
        </div>
        <div class="next-body">
          <strong id="nextTime">--:--</strong>
          <div>
            <h2 id="nextMedicine">读取中</h2>
            <p id="nextDose">--</p>
          </div>
          <em id="countdownText">--</em>
        </div>
      </article>

      <button class="service-card take-card" id="dispenseBtn">
        <span class="service-icon med-icon"></span>
        <div>
          <strong>开始取药</strong>
          <small>按计划取出药品</small>
        </div>
        <i></i>
      </button>

      <button class="service-card vital-card" id="readVitalsBtn">
        <span class="service-icon heart-icon"></span>
        <div>
          <strong>测量体征</strong>
          <small id="vitalsText">测量血压、心率、血氧等</small>
        </div>
        <i></i>
      </button>

      <button class="service-card camera-card" id="captureBtn">
        <span class="service-icon camera-icon"></span>
        <div>
          <strong>拍照识别药品</strong>
          <small id="recognitionText">识别条码、溯源码和药品信息</small>
        </div>
        <i></i>
      </button>

      <article class="slots-card">
        <div class="slots-head">
          <h2>药柜状态</h2>
          <a href="/cabinet.html">更多</a>
          <span>共23仓</span>
        </div>
        <div id="slots" class="slots"></div>
      </article>

      <a class="service-card ai-card" href="/consult.html">
        <span class="service-icon ai-icon">AI</span>
        <div>
          <strong>AI 问诊</strong>
          <small>结合档案、体征和病例记忆咨询</small>
        </div>
        <i></i>
      </a>
    </section>

    <footer class="status-bar">
      <span class="speaker"></span>
      <strong id="deviceText">系统已就绪，可以开始使用</strong>
      <a href="/admin.html">管理设置</a>
    </footer>
  </main>
  <div id="toast" class="toast"></div>
  <script src="/terminal.js"></script>
</body>
</html>
