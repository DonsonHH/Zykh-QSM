<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>摄像头预览 - 智药康护</title>
  <link rel="stylesheet" href="/camera.css">
</head>
<body>
  <main class="camera-page">
    <header class="bar">
      <a href="/" class="back">返回首页</a>
      <div>
        <h1>药品拍照识别</h1>
        <p id="statusText">请将药品包装或药盒放在镜头中央</p>
      </div>
      <button id="pauseBtn">暂停预览</button>
    </header>

    <section class="stage">
      <img id="liveImage" alt="摄像头实时画面">
      <div class="frame"></div>
      <div class="tips">
        <strong>识别区域</strong>
        <span>保持药品文字清晰、不要反光</span>
      </div>
    </section>

    <footer class="controls">
      <button id="captureBtn" class="primary">拍照识别</button>
      <button id="resumeBtn">继续预览</button>
      <div class="result">
        <span>识别结果</span>
        <strong id="resultText">等待识别</strong>
      </div>
    </footer>
  </main>
  <div id="toast" class="toast"></div>
  <script src="/camera.js"></script>
</body>
</html>
